<!DOCTYPE html>
<html>
<head>
    <style>
        
       

       
        .boxmain {
            display: flex;
            width: 100%;
            height: 100%; 
           
            
            box-sizing: border-box;
            padding: 5% 0%;
        }

       
        .innerbox1 { 
         
            padding-left: 50px;
        }

        .consulting-text {
            font-size: 18px;
            letter-spacing: 4px;
            color: #292d33;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .main-heading {
            font-size: 65px;
            line-height: 1.0; 
            color: #292d33;
            margin-bottom: 25px;
            font-weight: 900;
        }

        .freepik-text {
            font-size: 14px;
            color: #333;
            margin-bottom: 30px;
        }

       
        .read-more-btn {
            display: inline-block;
            background-color: #000000;
            color: #ffffff;
            padding: 18px 45px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            letter-spacing: 2px;
            
        }

       
        .read-more-btn:hover {
            background-color:rgb(251,110,66); 
            letter-spacing: 4px;     
        }

       
        .innerbox2 { 
            flex: 1; 
            display: flex;
            justify-content: flex-end;
        }
        
        .innerbox2 img { 
            width: 100%; 
            max-width: 750px;
            height: auto;
        }
    </style>
</head>
<body>

<div class="boxmain">
    <div class="innerbox1">
        <div class="consulting-text">CONSULTING COMPANY</div>
        <div class="main-heading">
            BUSINESS TAKEN <br> 
            TO THE NEW <br> 
            HEIGHTS
        </div>
        <div class="freepik-text">Image from <a href="#" style="color: #333;">Freepik</a></div>
        <a href="#" class="read-more-btn">READ MORE</a>
    </div>

    <div class="innerbox2">
        <img src="./ggg-min.jpg" alt="Business Image">
    </div>
</div>

</body>
</html>
